  const EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>';
  const NOTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>';
  const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>';

  // Helpers
  function sectionFor(n) { return SECTIONS.find(s => n >= s.start && n <= s.end); }
  function pad(n) { return String(n).padStart(3, '0'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Safe storage
  function safeGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }
  function safeParse(s, fallback) {
    try { return JSON.parse(s); } catch (e) { return fallback; }
  }

  // Detect iOS / standalone mode
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const showInstallHint = isIOS && !isStandalone && safeGet('dd_install_dismissed', '0') !== '1';

  // State
  let state = {
    tab: 'browse',
    view: 'sections',
    currentSection: null,
    currentQuestion: null,
    expandedNote: null,
    dark: (function() {
      const stored = safeGet('dd_dark', null);
      if (stored === '1') return true;
      if (stored === '0') return false;
      // Default to system preference on first visit
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    })(),
    bookmarks: safeParse(safeGet('dd_bookmarks', '[]'), []),
    notes: safeParse(safeGet('dd_notes', '{}'), {}),
    discussed: safeParse(safeGet('dd_discussed', '{}'), {}),
    settings: Object.assign({
      morningOn: false, morningTime: '08:00',
      eveningOn: true, eveningTime: '21:00',
      order: 'sequential', snooze: false
    }, safeParse(safeGet('dd_settings', '{}'), {}))
  };

  function save() {
    safeSet('dd_bookmarks', JSON.stringify(state.bookmarks));
    safeSet('dd_settings', JSON.stringify(state.settings));
    safeSet('dd_notes', JSON.stringify(state.notes));
    safeSet('dd_discussed', JSON.stringify(state.discussed));
    safeSet('dd_dark', state.dark ? '1' : '0');
  }

  function isBookmarked(n) { return state.bookmarks.indexOf(n) !== -1; }
  function toggleBookmark(n) {
    const i = state.bookmarks.indexOf(n);
    if (i !== -1) state.bookmarks.splice(i, 1);
    else state.bookmarks.push(n);
    save();
    render();
  }
  function toggleDiscussed(n) {
    if (state.discussed[n]) delete state.discussed[n];
    else state.discussed[n] = new Date().toISOString();
    save();
    render();
  }
  function setNote(n, v) {
    if (v.trim()) state.notes[n] = v;
    else delete state.notes[n];
    save();
  }

  // Renderers
  function renderQuestionCard(n, expanded) {
    const sec = sectionFor(n);
    const saved = isBookmarked(n);
    const note = state.notes[n] || '';
    const disc = state.discussed[n];
    return `<div class="q-card" data-question="${n}">
      <div class="q-head">
        <div style="flex: 1; min-width: 0;">
          <div class="section-pill">${esc(sec.title)}</div>
          <div class="q-num">No. ${pad(n)}</div>
        </div>
        <button class="heart-btn ${saved ? 'saved' : ''}" data-bookmark="${n}" aria-label="${saved ? 'Remove from saved' : 'Save question'}" aria-pressed="${saved}">
          ${saved ? HEART_FILLED : HEART_OUTLINE}
        </button>
      </div>
      <p class="q-text">${esc(Q[n])}</p>
      <div class="q-actions">
        ${disc
          ? `<button class="action-btn is-active" data-discussed="${n}">${CHECK_ICON} Discussed ${fmtDate(disc)}</button>`
          : `<button class="action-btn" data-discussed="${n}">Mark as discussed</button>`}
        <button class="action-btn ${note ? 'has-note' : ''}" data-expand="${n}">${note ? NOTE_ICON : EDIT_ICON} ${note ? 'Notes saved' : 'Add a note'}</button>
      </div>
      ${expanded ? `
        <div class="notes-wrap">
          <textarea class="notes-area" data-note="${n}" placeholder="Realizations, partner's answer, your own answer, anything you don't want to forget...">${esc(note)}</textarea>
          <p class="note-hint">Saved automatically. Stays on this device.</p>
        </div>
      ` : ''}
    </div>`;
  }

  function renderInstallHint() {
    if (!showInstallHint) return '';
    return `
      <div class="install-card" id="install-card">
        <div class="install-card-icon">${SHARE_ICON}</div>
        <div class="install-card-text">
          Add to your home screen for the full experience: tap the Share button below, then "Add to Home Screen."
        </div>
        <button class="install-close" id="install-close" aria-label="Dismiss">\u00D7</button>
      </div>
    `;
  }

  function renderBrowse() {
    if (state.view === 'sections') {
      const rows = SECTIONS.map(s => `
        <div class="section-row" data-section="${s.id}">
          <div class="s-roman">${s.roman}.</div>
          <div class="s-info">
            <div class="s-title">${esc(s.title)}</div>
            <div class="s-sub">${esc(s.subtitle)}</div>
          </div>
          <div class="s-range">${pad(s.start)}\u2013${pad(s.end)}</div>
        </div>
      `).join('');
      return `
        ${renderInstallHint()}
        <div class="intro-block">
          <p class="intro-sub">Fifteen sections.<br>Three hundred and sixty-five questions.</p>
          <div class="intro-ornament">\u2767</div>
        </div>
        <button class="ghost-btn" id="pick-random" style="width: 100%; margin-bottom: 0.5rem;">
          ${SPARKLES_ICON} Pick one for me
        </button>
        <div style="margin-top: 1.25rem;">${rows}</div>
      `;
    }
    if (state.view === 'section-list') {
      const sec = SECTIONS.find(s => s.id === state.currentSection);
      const cards = [];
      for (let i = sec.start; i <= sec.end; i++) {
        cards.push(renderQuestionCard(i, state.expandedNote === i));
      }
      return `
        <button class="ghost-btn" id="back-to-sections" style="margin-bottom: 1rem;">
          ${ARROW_LEFT} All sections
        </button>
        <div class="intro-block">
          <p class="eyebrow">Section ${sec.roman} of XV</p>
          <h2 class="intro-title">${esc(sec.title)}</h2>
          <p class="intro-sub">${esc(sec.subtitle)}</p>
          <div class="intro-ornament">\u2767</div>
        </div>
        ${cards.join('')}
      `;
    }
    if (state.view === 'single') {
      const n = state.currentQuestion;
      return `
        <button class="ghost-btn" id="back-to-sections" style="margin-bottom: 1rem;">
          ${ARROW_LEFT} Back
        </button>
        ${renderQuestionCard(n, state.expandedNote === n)}
        <button class="ghost-btn" id="pick-random" style="width: 100%; margin-top: 0.5rem;">
          ${SPARKLES_ICON} Another one
        </button>
      `;
    }
  }

  function toggleHTML(checked, id) {
    return `<label class="toggle"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} /><span class="toggle-bg ${checked ? 'on' : ''}"></span></label>`;
  }

  function renderDaily() {
    const s = state.settings;
    return `
      <div class="intro-block">
        <p class="eyebrow">Notifications</p>
        <h2 class="intro-title">A question a <em>day</em></h2>
        <p class="intro-sub">Set your rhythm, then download<br>the notification file at the bottom.</p>
        <div class="intro-ornament">\u2767</div>
      </div>

      <div class="surface">
        <div class="row">
          <div>
            <div class="row-label">Morning question</div>
            <div class="row-sub">A prompt to start the day</div>
          </div>
          ${toggleHTML(s.morningOn, 'morning-on')}
        </div>
        ${s.morningOn ? `<div class="row"><div class="row-label">Time</div><input type="time" id="morning-time" value="${s.morningTime}" /></div>` : ''}
      </div>

      <div class="surface">
        <div class="row">
          <div>
            <div class="row-label">Evening question</div>
            <div class="row-sub">Before bed, before screens</div>
          </div>
          ${toggleHTML(s.eveningOn, 'evening-on')}
        </div>
        ${s.eveningOn ? `<div class="row"><div class="row-label">Time</div><input type="time" id="evening-time" value="${s.eveningTime}" /></div>` : ''}
      </div>

      <div style="margin: 1.25rem 0 1rem;">
        <div class="chip-label">Question order</div>
        <div style="display: flex; gap: 8px;">
          <button class="chip ${s.order === 'sequential' ? 'on' : ''}" data-order="sequential">In order \u00B7 1\u2192365</button>
          <button class="chip ${s.order === 'random' ? 'on' : ''}" data-order="random">Random</button>
        </div>
      </div>

      <div class="surface">
        <div class="row">
          <div>
            <div class="row-label">Allow snooze</div>
            <div class="row-sub">Skip a day without losing your place</div>
          </div>
          ${toggleHTML(s.snooze, 'snooze-on')}
        </div>
      </div>

      <button class="primary-btn" id="download-ics">
        ${DOWNLOAD_ICON} Download notification file
      </button>
      <p class="download-hint">Imports as its own calendar named "Deeper Dating."<br>Toggle it on or off anytime in the Calendars list —<br>without touching your main calendar.</p>
    `;
  }

  function renderBookmarks() {
    if (state.bookmarks.length === 0) {
      return `
        <div class="empty">
          <div class="empty-icon">${HEART_OUTLINE.replace('heart-svg', 'heart-svg" style="width:40px;height:40px')}</div>
          <p class="empty-title">No saved questions yet</p>
          <p class="empty-sub">Tap the heart on any question<br>to keep it close.</p>
        </div>
      `;
    }
    const sorted = state.bookmarks.slice().sort((a, b) => a - b);
    return `
      <div class="intro-block">
        <p class="eyebrow">For Later</p>
        <h2 class="intro-title">The <em>kept</em> ones</h2>
        <p class="intro-sub">${sorted.length} question${sorted.length === 1 ? '' : 's'} worth coming back to</p>
        <div class="intro-ornament">\u2767</div>
      </div>
      ${sorted.map(n => renderQuestionCard(n, state.expandedNote === n)).join('')}
    `;
  }

  function render() {
    document.body.classList.toggle('dark', state.dark);
    document.getElementById('mode-toggle').innerHTML = state.dark ? SUN_ICON : MOON_ICON;

    const savedTabIcon = document.getElementById('saved-tab-icon');
    if (savedTabIcon) savedTabIcon.innerHTML = state.bookmarks.length > 0 ? HEART_TAB_FILLED : HEART_TAB;

    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });

    const content = document.getElementById('content');
    if (state.tab === 'browse') content.innerHTML = renderBrowse();
    else if (state.tab === 'daily') content.innerHTML = renderDaily();
    else if (state.tab === 'bookmarks') content.innerHTML = renderBookmarks();
  }

  // ICS generation
  function pad2(n) { return String(n).padStart(2, '0'); }
  function icsDate(d) {
    return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
  }
  function generateICS() {
    const s = state.settings;
    let order = [];
    for (let i = 1; i <= 365; i++) order.push(i);
    if (s.order === 'random') {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    }
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Deeper Dating//365 Questions//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Deeper Dating · 365 Questions','X-WR-CALDESC:A year of daily questions for closer conversations','X-APPLE-CALENDAR-COLOR:#8B6F4E'];
    const start = new Date();
    start.setHours(0,0,0,0);
    start.setDate(start.getDate() + 1);
    const times = [];
    if (s.morningOn) times.push({ label: 'Morning', time: s.morningTime });
    if (s.eveningOn) times.push({ label: 'Evening', time: s.eveningTime });
    if (times.length === 0) times.push({ label: 'Daily', time: '20:00' });

    for (let day = 0; day < 365; day++) {
      const qNum = order[day];
      const sec = sectionFor(qNum);
      times.forEach(t => {
        const [hh, mm] = t.time.split(':').map(Number);
        const dt = new Date(start);
        dt.setDate(dt.getDate() + day);
        dt.setHours(hh, mm, 0, 0);
        const dtEnd = new Date(dt.getTime() + 15 * 60000);
        const uid = `dd-${qNum}-${t.label}-${day}@deeperdating`;
        const cleanQ = Q[qNum].replace(/[,;\\]/g, ' ');
        const summary = `Q${pad(qNum)} \u00B7 ${cleanQ.slice(0, 90)}`;
        const desc = `${sec.title}\\n\\n${cleanQ}`;
        lines.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(dt),'DTEND:'+icsDate(dtEnd),'SUMMARY:'+summary,'DESCRIPTION:'+desc,'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:'+summary,'END:VALARM','END:VEVENT');
      });
    }
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS() {
    const ics = generateICS();
    const blob = new Blob([ics], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'deeper-dating-365.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Event handlers
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.tab = b.dataset.tab;
      state.view = 'sections';
      state.expandedNote = null;
      render();
      document.getElementById('content').scrollTop = 0;
    });
  });

  document.getElementById('mode-toggle').addEventListener('click', () => {
    state.dark = !state.dark;
    save();
    render();
  });

  document.getElementById('content').addEventListener('click', e => {
    // Bookmark first — protect against bubbling
    const bm = e.target.closest('[data-bookmark]');
    if (bm) {
      e.preventDefault();
      e.stopPropagation();
      toggleBookmark(Number(bm.dataset.bookmark));
      return;
    }
    if (e.target.closest('#install-close')) {
      safeSet('dd_install_dismissed', '1');
      const card = document.getElementById('install-card');
      if (card) card.style.display = 'none';
      return;
    }
    const sectionEl = e.target.closest('[data-section]');
    if (sectionEl) {
      state.currentSection = Number(sectionEl.dataset.section);
      state.view = 'section-list';
      state.expandedNote = null;
      render();
      document.getElementById('content').scrollTop = 0;
      return;
    }
    if (e.target.closest('#back-to-sections')) {
      state.view = 'sections';
      state.expandedNote = null;
      render();
      document.getElementById('content').scrollTop = 0;
      return;
    }
    if (e.target.closest('#pick-random')) {
      state.currentQuestion = Math.floor(Math.random() * 365) + 1;
      state.view = 'single';
      state.expandedNote = null;
      render();
      document.getElementById('content').scrollTop = 0;
      return;
    }
    const disc = e.target.closest('[data-discussed]');
    if (disc) { toggleDiscussed(Number(disc.dataset.discussed)); return; }
    const exp = e.target.closest('[data-expand]');
    if (exp) {
      const n = Number(exp.dataset.expand);
      state.expandedNote = (state.expandedNote === n) ? null : n;
      render();
      return;
    }
    const order = e.target.closest('[data-order]');
    if (order) {
      state.settings.order = order.dataset.order;
      save();
      render();
      return;
    }
    if (e.target.closest('#download-ics')) {
      downloadICS();
      const btn = document.getElementById('download-ics');
      btn.innerHTML = CHECK_ICON + ' Downloaded';
      setTimeout(() => render(), 1800);
      return;
    }
  });

  document.getElementById('content').addEventListener('change', e => {
    if (e.target.id === 'morning-on') { state.settings.morningOn = e.target.checked; save(); render(); }
    if (e.target.id === 'evening-on') { state.settings.eveningOn = e.target.checked; save(); render(); }
    if (e.target.id === 'snooze-on') { state.settings.snooze = e.target.checked; save(); render(); }
    if (e.target.id === 'morning-time') { state.settings.morningTime = e.target.value; save(); }
    if (e.target.id === 'evening-time') { state.settings.eveningTime = e.target.value; save(); }
  });

  document.getElementById('content').addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.note) {
      setNote(Number(e.target.dataset.note), e.target.value);
    }
  });

  // Initial render + hide splash
  render();
  setTimeout(() => {
    const splash = document.getElementById('splash');
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 600);
  }, 500);

})();

</script>
</body>
</html>
